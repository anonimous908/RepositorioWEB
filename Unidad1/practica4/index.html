<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidad 1 - Práctica 4</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Crear titulo -->
<h1 class="titulo">Unidad 1 - Práctica 4</h1>

<!-- Crear subtitulo -->
<h2 class="subtitulo">Formulario de Registro</h2>

<div class="contenedor-formulario">

<form id="inicio-sesion" class="formulario">
    <h3 class="iniciosesion">Iniciar Sesión</h3>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required>
    <br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Restablecer cuenta">
</form>


<form id="registro" class="formulario">
<h3 class="registrarsesion">Registrarse</h3>
    <label for="nombre_registro">Nombre:</label>
    <input type="text" id="nombre_registro" name="nombre_registro" required>
    <br><br>
    <label for="email_registro">Email:</label>
    <input type="email" id="email_registro" name="email_registro" required>
    <br><br>
    <label for="contrasena_registro">Contraseña:</label>
    <input type="password" id="contrasena_registro" name="contrasena_registro" required>
    <br><br>
    <input type="submit" value="Registrarse">
</form>

</div>

</body>
</html>
