<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="postit-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <marker id="pen-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#b91c1c"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#047857"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Kalam:wght@400;700&amp;family=Patrick+Hand&amp;display=swap');
      .title { font-family: 'Kalam', 'Caveat', cursive; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Patrick Hand', 'Caveat', cursive; font-size: 15px; fill: #64748b; }
      .pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #1e3a8a; font-size: 18px; }
      .pen-lg { font-family: 'Kalam', 'Caveat', cursive; fill: #172554; font-size: 22px; font-weight: 700; }
      .pencil { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #334155; font-size: 17px; }
      .pencil-sm { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #475569; font-size: 14.5px; }
      .red-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #b91c1c; font-size: 16.5px; font-weight: 700; }
      .green-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #047857; font-size: 17px; font-weight: 700; }
      .bubble { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .bubble-double { fill: none; stroke: #1e3a8a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
      .box { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pen { fill: none; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pencil { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-red { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .highlight-yellow { fill: #fef08a; fill-opacity: 0.85; rx: 4px; }
      .highlight-blue { fill: #bae6fd; fill-opacity: 0.85; rx: 4px; }
      .highlight-green { fill: #bbf7d0; fill-opacity: 0.85; rx: 4px; }
      .highlight-rose { fill: #fecdd3; fill-opacity: 0.85; rx: 4px; }
      .tape { fill: #fed7aa; fill-opacity: 0.85; stroke: #fdba74; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Title top left -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="title">3. Clean: Las 4 murallas de protección</text>
    <text x="0" y="22" class="subtitle">El corazón en el centro; las herramientas afuera para cambiarlas sin miedo</text>
  </g>

  <!-- Sticky Note top right -->
  <g transform="translate(725, 20) rotate(2)" filter="url(#postit-shadow)">
    <rect x="0" y="0" width="210" height="155" fill="#fef9c3" stroke="#fef08a" stroke-width="1" rx="3"/>
    <rect x="70" y="-8" width="70" height="18" class="tape" rx="2" transform="rotate(-3 100 0)"/>
    <text x="15" y="25" class="pen" font-weight="bold" font-size="14" fill="#854d0e">💡 EN PALABRAS SIMPLES:</text>
    
    <text x="15" y="48" class="pencil" font-size="13">"El centro es intocable:</text>
    <text x="15" y="68" class="pencil" font-size="13">si mañana cambiás la</text>
    <text x="15" y="88" class="pencil" font-size="13">base de datos o la pantalla,</text>
    <text x="15" y="108" class="pencil" font-size="13">el negocio real de tu app</text>
    <text x="15" y="128" class="green-pen" font-size="13">sigue intacto sin cambios."</text>

  </g>

  
  <!-- Concentric Rings (Concentric Circles) -->
  <g transform="translate(240, 360)">
    <!-- Ring 4: Herramientas (Outermost) -->
    <circle cx="0" cy="0" r="230" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- Ring 3: Puentes -->
    <circle cx="0" cy="0" r="170" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e3a8a" stroke-width="2.4"/>

    <!-- Ring 2: Acciones -->
    <circle cx="0" cy="0" r="115" fill="#fef08a" fill-opacity="0.6" stroke="#1e3a8a" stroke-width="2.4"/>

    <!-- Ring 1: El Corazón (Center) -->
    <circle cx="0" cy="0" r="60" fill="#86efac" stroke="#047857" stroke-width="3"/>
    
    <text x="0" y="-8" class="green-pen" font-size="18" text-anchor="middle">1. EL CORAZÓN</text>
    <text x="0" y="14" class="pencil" font-size="14" text-anchor="middle">(Las Reglas)</text>
    <text x="0" y="30" class="pencil-sm" font-size="12" text-anchor="middle">Usuario, Saldo</text>

    <!-- Ring 2 label -->
    <text x="0" y="-85" class="pen-lg" font-size="18" text-anchor="middle">2. LAS ACCIONES</text>
    <text x="0" y="-68" class="pencil-sm" text-anchor="middle">Iniciar sesión, Comprar</text>

    <!-- Ring 3 label -->
    <text x="0" y="-140" class="pen-lg" font-size="17" text-anchor="middle">3. LOS PUENTES</text>
    <text x="0" y="-123" class="pencil-sm" text-anchor="middle">Adaptan el dato crudo</text>

    <!-- Ring 4 label -->
    <text x="0" y="-200" class="pen-lg" font-size="17" text-anchor="middle">4. LAS HERRAMIENTAS</text>
    <text x="0" y="-183" class="pencil-sm" text-anchor="middle">Pantalla, Base de datos, Servidor</text>

    <!-- Dependency Arrows pointing INWARDS -->
    <path d="M 0 215 L 0 185" class="stroke-red" stroke-width="3" marker-end="url(#red-arrow)"/>
    <path d="M 0 155 L 0 125" class="stroke-red" stroke-width="3" marker-end="url(#red-arrow)"/>
    <path d="M 0 100 L 0 70" class="stroke-red" stroke-width="3" marker-end="url(#red-arrow)"/>
    <text x="15" y="145" class="red-pen" font-size="13">Siempre miran hacia el centro ➔</text>
  </g>

  <!-- Explanation Cards on the Right -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="410" height="75" class="box" stroke-width="2"/>
    <rect x="10" y="8" width="180" height="22" class="highlight-green"/>
    <text x="15" y="25" class="green-pen" font-size="17">1. El Corazón (Entities)</text>
    <text x="15" y="48" class="pencil-sm">Lo más valioso. No sabe que existe Android ni internet.</text>
    <text x="15" y="65" class="pencil-sm">Sobrevive a cualquier cambio técnico.</text>
  </g>

  <g transform="translate(520, 248)">
    <rect x="0" y="0" width="410" height="75" class="box" stroke-width="2"/>
    <rect x="10" y="8" width="180" height="22" class="highlight-yellow"/>
    <text x="15" y="25" class="pen" font-size="17">2. Las Acciones (Use Cases)</text>
    <text x="15" y="48" class="pencil-sm">Qué puede hacer el usuario con el corazón.</text>
    <text x="15" y="65" class="pencil-sm">Una sola tarea clara: "Calcular Descuento".</text>
  </g>

  <g transform="translate(520, 336)">
    <rect x="0" y="0" width="410" height="82" class="box" stroke-width="2"/>
    <rect x="10" y="8" width="180" height="22" class="highlight-blue"/>
    <text x="15" y="25" class="pen" font-size="17">3. Los Puentes (Interfaces)</text>
    <text x="15" y="46" class="pencil-sm">El contrato que conecta sin atarse.</text>
    <text x="15" y="62" class="pencil-sm">"Necesito guardar datos, no me importa si es</text>
    <text x="15" y="77" class="pencil-sm">en SQLite o en la nube".</text>
  </g>

  <g transform="translate(520, 430)">
    <rect x="0" y="0" width="410" height="85" class="box" stroke-width="2"/>
    <rect x="10" y="8" width="220" height="22" class="highlight-rose"/>
    <text x="15" y="25" class="red-pen" font-size="17">4. Las Herramientas (Frameworks)</text>
    <text x="15" y="48" class="pencil-sm">Lo intercambiable: Compose, Retrofit, Room.</text>
    <text x="15" y="66" class="pencil-sm">Están afuera para que tirarlas y cambiarlas</text>
    <text x="15" y="81" class="pencil-sm">sea fácil y rápido.</text>
  </g>


</svg>