<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="postit-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <marker id="pen-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#b91c1c"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#047857"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Kalam:wght@400;700&amp;family=Patrick+Hand&amp;display=swap');
      .title { font-family: 'Kalam', 'Caveat', cursive; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Patrick Hand', 'Caveat', cursive; font-size: 15px; fill: #64748b; }
      .pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #1e3a8a; font-size: 18px; }
      .pen-lg { font-family: 'Kalam', 'Caveat', cursive; fill: #172554; font-size: 22px; font-weight: 700; }
      .pencil { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #334155; font-size: 17px; }
      .pencil-sm { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #475569; font-size: 14.5px; }
      .red-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #b91c1c; font-size: 16.5px; font-weight: 700; }
      .green-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #047857; font-size: 17px; font-weight: 700; }
      .bubble { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .bubble-double { fill: none; stroke: #1e3a8a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
      .box { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pen { fill: none; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pencil { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-red { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .highlight-yellow { fill: #fef08a; fill-opacity: 0.85; rx: 4px; }
      .highlight-blue { fill: #bae6fd; fill-opacity: 0.85; rx: 4px; }
      .highlight-green { fill: #bbf7d0; fill-opacity: 0.85; rx: 4px; }
      .highlight-rose { fill: #fecdd3; fill-opacity: 0.85; rx: 4px; }
      .tape { fill: #fed7aa; fill-opacity: 0.85; stroke: #fdba74; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Title top left -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="title">1. MVVM: Hablar con los datos</text>
    <text x="0" y="22" class="subtitle">La pantalla es tonta, el traductor organiza y los datos se guardan aparte</text>
  </g>

  <!-- Sticky Note top right -->
  <g transform="translate(725, 20) rotate(2)" filter="url(#postit-shadow)">
    <rect x="0" y="0" width="210" height="155" fill="#fef9c3" stroke="#fef08a" stroke-width="1" rx="3"/>
    <rect x="70" y="-8" width="70" height="18" class="tape" rx="2" transform="rotate(-3 100 0)"/>
    <text x="15" y="25" class="pen" font-weight="bold" font-size="14" fill="#854d0e">💡 EN PALABRAS SIMPLES:</text>
    
    <text x="15" y="48" class="pencil" font-size="13">"La pantalla es tonta: no</text>
    <text x="15" y="68" class="pencil" font-size="13">piensa nada. Solo dibuja</text>
    <text x="15" y="88" class="pencil" font-size="13">lo que el traductor le da</text>
    <text x="15" y="108" class="pencil" font-size="13">masticado y avisa cuando</text>
    <text x="15" y="128" class="red-pen" font-size="13">el usuario toca algo."</text>

  </g>

  
  <!-- Top: UI Container -->
  <g transform="translate(65, 75)">
    <path d="M 25 45 C 25 5, 180 0, 360 2 C 530 4, 635 12, 630 60 C 625 130, 495 150, 330 145 C 160 140, 25 130, 25 45 Z" class="bubble" stroke-width="2.6"/>
    <path d="M 29 47 C 29 9, 182 4, 360 6 C 528 8, 631 15, 626 60 C 621 126, 493 146, 330 141 C 162 136, 29 126, 29 47 Z" class="bubble-double"/>
    <text x="45" y="28" class="pen-lg" font-size="24">UI (Lo que ve el usuario)</text>

    <!-- View bubble -->
    <rect x="60" y="40" width="135" height="42" class="highlight-yellow"/>
    <path d="M 55 58 C 55 38, 105 36, 150 38 C 180 40, 195 56, 185 73 C 170 90, 100 93, 70 86 C 57 80, 55 68, 55 58 Z" class="bubble"/>
    <text x="120" y="66" class="pen-lg" text-anchor="middle">View</text>
    <text x="120" y="100" class="pencil-sm" text-anchor="middle">La Pantalla</text>

    <!-- Arrows View <-> ViewModel -->
    <path d="M 190 53 C 220 50, 240 50, 265 53" class="stroke-pen" marker-end="url(#pen-arrow)"/>
    <text x="228" y="44" class="pencil-sm" text-anchor="middle">Toques</text>

    <path d="M 265 73 C 240 75, 220 75, 190 73" class="stroke-pen" marker-end="url(#pen-arrow)"/>
    <text x="228" y="90" class="green-pen" font-size="13" text-anchor="middle">Datos listos</text>

    <!-- ViewModel bubble -->
    <rect x="280" y="40" width="315" height="44" class="highlight-blue"/>
    <path d="M 275 58 C 275 36, 375 30, 485 33 C 575 36, 595 56, 585 76 C 570 98, 405 100, 310 93 C 275 88, 275 73, 275 58 Z" class="bubble"/>
    <text x="430" y="66" class="pen-lg" text-anchor="middle">ViewModel</text>
    <text x="430" y="100" class="pencil-sm" text-anchor="middle">El Traductor y Organizador</text>
  </g>

  <!-- Middle Pipeline: Traduce + Dato Crudo -->
  <g transform="translate(65, 205)">
    <line x1="430" y1="18" x2="430" y2="120" class="stroke-pen" stroke-width="2.5"/>
    <line x1="480" y1="18" x2="480" y2="120" class="stroke-pen" stroke-width="2.5"/>

    <rect x="438" y="55" width="34" height="26" class="highlight-yellow"/>
    <text x="455" y="73" class="pen" font-size="17" text-anchor="middle">traduce</text>
    <path d="M 455 100 L 455 35" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

    <rect x="400" y="120" width="110" height="32" class="highlight-rose"/>
    <text x="455" y="142" class="red-pen" font-size="22" text-anchor="middle">dato crudo</text>
  </g>

  <!-- Data Branch (Left) -->
  <g transform="translate(65, 340)">
    <path d="M 400 15 C 280 20, 210 50, 180 125" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>
    <rect x="240" y="30" width="50" height="28" class="box"/>
    <line x1="265" y1="30" x2="265" y2="58" class="stroke-pen"/>
    <text x="265" y="22" class="pencil" text-anchor="middle">datos</text>

    <g transform="translate(30, 130)">
      <path d="M 20 40 C 20 10, 120 5, 250 8 C 300 10, 310 25, 300 50 C 285 75, 210 80, 90 75 C 20 70, 20 50, 20 40 Z" class="bubble" stroke-width="2.5"/>
      <rect x="45" y="25" width="235" height="32" class="highlight-blue"/>
      <text x="160" y="47" class="pen-lg" text-anchor="middle">Data (De dónde vienen)</text>
      
      <text x="160" y="98" class="pencil" text-anchor="middle">Lo conoce solo la función que busca</text>
      <text x="160" y="120" class="pencil-sm" text-anchor="middle">• Es intercambiable</text>
      <text x="160" y="138" class="pencil-sm" text-anchor="middle">• Hoy viene de internet, mañana de un archivo guardado</text>
      <text x="160" y="156" class="pencil-sm" text-anchor="middle">• No importa el formato (JSON, base de datos, memoria)</text>
    </g>
  </g>

  <!-- Domain Branch (Right) -->
  <g transform="translate(65, 340)">
    <path d="M 510 15 C 630 20, 700 50, 730 125" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>
    <rect x="620" y="30" width="50" height="28" class="box"/>
    <line x1="645" y1="30" x2="645" y2="58" class="stroke-pen"/>
    <text x="645" y="22" class="pencil" text-anchor="middle">negocio</text>

    <g transform="translate(580, 130)">
      <path d="M 20 40 C 20 10, 120 5, 250 8 C 300 10, 310 25, 300 50 C 285 75, 210 80, 90 75 C 20 70, 20 50, 20 40 Z" class="bubble" stroke-width="2.5"/>
      <rect x="35" y="25" width="250" height="32" class="highlight-green"/>
      <text x="160" y="47" class="pen-lg" text-anchor="middle">Domain (Las reglas reales)</text>
      
      <text x="160" y="98" class="pencil" text-anchor="middle">Lo conoce por su nombre</text>
      <text x="160" y="120" class="green-pen" text-anchor="middle">• Único, no alterable</text>
      <text x="160" y="138" class="pencil-sm" text-anchor="middle">• Lo que vale oro: "Usuario", "Compra", "Saldo"</text>
      <text x="160" y="156" class="pencil-sm" text-anchor="middle">• No depende de ninguna tecnología ni pantalla</text>
    </g>
  </g>


</svg>