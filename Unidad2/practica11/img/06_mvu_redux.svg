<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="postit-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <marker id="pen-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#b91c1c"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#047857"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Kalam:wght@400;700&amp;family=Patrick+Hand&amp;display=swap');
      .title { font-family: 'Kalam', 'Caveat', cursive; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Patrick Hand', 'Caveat', cursive; font-size: 15px; fill: #64748b; }
      .pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #1e3a8a; font-size: 18px; }
      .pen-lg { font-family: 'Kalam', 'Caveat', cursive; fill: #172554; font-size: 22px; font-weight: 700; }
      .pencil { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #334155; font-size: 17px; }
      .pencil-sm { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #475569; font-size: 14.5px; }
      .red-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #b91c1c; font-size: 16.5px; font-weight: 700; }
      .green-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #047857; font-size: 17px; font-weight: 700; }
      .bubble { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .bubble-double { fill: none; stroke: #1e3a8a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
      .box { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pen { fill: none; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pencil { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-red { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .highlight-yellow { fill: #fef08a; fill-opacity: 0.85; rx: 4px; }
      .highlight-blue { fill: #bae6fd; fill-opacity: 0.85; rx: 4px; }
      .highlight-green { fill: #bbf7d0; fill-opacity: 0.85; rx: 4px; }
      .highlight-rose { fill: #fecdd3; fill-opacity: 0.85; rx: 4px; }
      .tape { fill: #fed7aa; fill-opacity: 0.85; stroke: #fdba74; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Title top left -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="title">6. MVU / Redux: El juego de mesa</text>
    <text x="0" y="22" class="subtitle">Un solo tablero, cartas de jugadas y un árbitro estricto que las anota</text>
  </g>

  <!-- Sticky Note top right -->
  <g transform="translate(725, 20) rotate(2)" filter="url(#postit-shadow)">
    <rect x="0" y="0" width="210" height="155" fill="#fef9c3" stroke="#fef08a" stroke-width="1" rx="3"/>
    <rect x="70" y="-8" width="70" height="18" class="tape" rx="2" transform="rotate(-3 100 0)"/>
    <text x="15" y="25" class="pen" font-weight="bold" font-size="14" fill="#854d0e">💡 EN PALABRAS SIMPLES:</text>
    
    <text x="15" y="48" class="pencil" font-size="13">"Nadie toca el tablero</text>
    <text x="15" y="68" class="pencil" font-size="13">a escondidas. Cada</text>
    <text x="15" y="88" class="pencil" font-size="13">jugada pasa por el árbitro</text>
    <text x="15" y="108" class="pencil" font-size="13">y queda registrada en el</text>
    <text x="15" y="128" class="red-pen" font-size="13">historial de la partida."</text>

  </g>

  
  <!-- Center: El Tablero Único (Store) -->
  <g transform="translate(300, 95)">
    <rect x="0" y="0" width="340" height="90" class="box" stroke-width="2.6" fill="#f0fdf4"/>
    <rect x="15" y="10" width="310" height="28" class="highlight-green"/>
    <text x="170" y="30" class="green-pen" font-size="21" text-anchor="middle">1. EL TABLERO (Store / State)</text>
    <text x="170" y="58" class="pencil" text-anchor="middle">La única verdad de todo el juego</text>
    <text x="170" y="78" class="pencil-sm" text-anchor="middle">Nadie lo puede alterar por la espalda</text>
  </g>

  <!-- Arrow Store -> View (Right to Down) -->
  <path d="M 640 140 C 730 140, 750 200, 750 260" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>
  <text x="730" y="200" class="pencil-sm" text-anchor="middle">Lee el tablero ➔</text>

  <!-- View (Right Bottom) -->
  <g transform="translate(620, 260)">
    <rect x="0" y="0" width="230" height="85" class="box" stroke-width="2.2"/>
    <rect x="10" y="10" width="210" height="25" class="highlight-yellow"/>
    <text x="115" y="28" class="pen-lg" font-size="19" text-anchor="middle">2. LOS JUGADORES (View)</text>
    <text x="115" y="54" class="pencil" text-anchor="middle">Ven las fichas en el tablero</text>
    <text x="115" y="72" class="pencil-sm" text-anchor="middle">Cuando quieren jugar, tiran un dado</text>
  </g>

  <!-- Arrow View -> Action (Down to Left) -->
  <path d="M 620 310 C 560 310, 520 310, 480 310" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

  <!-- Action Box (Center Bottom) -->
  <g transform="translate(270, 260)">
    <rect x="0" y="0" width="205" height="85" class="box" stroke-width="2.2"/>
    <rect x="10" y="10" width="185" height="25" class="highlight-rose"/>
    <text x="102" y="28" class="red-pen" font-size="19" text-anchor="middle">3. LA JUGADA (Action)</text>
    <text x="102" y="54" class="pencil" text-anchor="middle">"Mover peón al casillero 4"</text>
    <text x="102" y="72" class="pencil-sm" text-anchor="middle">Es solo una carta con la intención</text>
  </g>

  <!-- Arrow Action -> Reducer (Right to Left) -->
  <path d="M 270 310 C 220 310, 180 310, 130 310" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

  <!-- Reducer / Árbitro (Left) -->
  <g transform="translate(20, 260)">
    <rect x="0" y="0" width="210" height="85" class="box" stroke-width="2.5"/>
    <rect x="10" y="10" width="190" height="25" class="highlight-blue"/>
    <text x="105" y="28" class="pen-lg" font-size="19" text-anchor="middle">4. EL ÁRBITRO (Reducer)</text>
    <text x="105" y="54" class="pencil" text-anchor="middle">Acepta o corrige la jugada</text>
    <text x="105" y="72" class="pencil-sm" text-anchor="middle">Actualiza el tablero oficialmente</text>
  </g>

  <!-- Arrow Reducer -> Store (Left to Top) -->
  <path d="M 125 260 C 125 140, 200 140, 300 140" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>
  <text x="210" y="130" class="green-pen" font-size="14" text-anchor="middle">Nuevo tablero ➔</text>

  <!-- Historic / Time Travel Callout -->
  <g transform="translate(190, 430)">
    <rect x="0" y="0" width="560" height="90" class="box" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.2"/>
    <text x="280" y="32" class="pen-lg" fill="#7e22ce" font-size="20" text-anchor="middle">⏪ REBOBINAR LA PARTIDA (Time Travel)</text>
    <text x="280" y="58" class="pencil" text-anchor="middle">Como cada jugada fue registrada en orden, podés volver hacia atrás turno por turno</text>
    <text x="280" y="78" class="pencil-sm" text-anchor="middle">Ideal para saber exactamente en qué jugada ocurrió un error</text>
  </g>


</svg>