<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="postit-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <marker id="pen-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#1e3a8a"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#b91c1c"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 6 L 1 10 C 3 6 3 6 1 2 Z" fill="#047857"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Kalam:wght@400;700&amp;family=Patrick+Hand&amp;display=swap');
      .title { font-family: 'Kalam', 'Caveat', cursive; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Patrick Hand', 'Caveat', cursive; font-size: 15px; fill: #64748b; }
      .pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #1e3a8a; font-size: 18px; }
      .pen-lg { font-family: 'Kalam', 'Caveat', cursive; fill: #172554; font-size: 22px; font-weight: 700; }
      .pencil { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #334155; font-size: 17px; }
      .pencil-sm { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #475569; font-size: 14.5px; }
      .red-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #b91c1c; font-size: 16.5px; font-weight: 700; }
      .green-pen { font-family: 'Patrick Hand', 'Caveat', cursive; fill: #047857; font-size: 17px; font-weight: 700; }
      .bubble { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .bubble-double { fill: none; stroke: #1e3a8a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
      .box { fill: #ffffff; fill-opacity: 1; stroke: #1e3a8a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pen { fill: none; stroke: #1e3a8a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-pencil { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-red { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .highlight-yellow { fill: #fef08a; fill-opacity: 0.85; rx: 4px; }
      .highlight-blue { fill: #bae6fd; fill-opacity: 0.85; rx: 4px; }
      .highlight-green { fill: #bbf7d0; fill-opacity: 0.85; rx: 4px; }
      .highlight-rose { fill: #fecdd3; fill-opacity: 0.85; rx: 4px; }
      .tape { fill: #fed7aa; fill-opacity: 0.85; stroke: #fdba74; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Title top left -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="title">2. MVI: El circuito de una sola dirección</text>
    <text x="0" y="22" class="subtitle">La información avanza como en una cinta de fábrica: sin marcha atrás</text>
  </g>

  <!-- Sticky Note top right -->
  <g transform="translate(725, 20) rotate(2)" filter="url(#postit-shadow)">
    <rect x="0" y="0" width="210" height="155" fill="#fef9c3" stroke="#fef08a" stroke-width="1" rx="3"/>
    <rect x="70" y="-8" width="70" height="18" class="tape" rx="2" transform="rotate(-3 100 0)"/>
    <text x="15" y="25" class="pen" font-weight="bold" font-size="14" fill="#854d0e">💡 EN PALABRAS SIMPLES:</text>
    
    <text x="15" y="48" class="pencil" font-size="13">"Como una cinta de fábrica:</text>
    <text x="15" y="68" class="pencil" font-size="13">la información avanza en</text>
    <text x="15" y="88" class="pencil" font-size="13">un solo sentido. Si algo</text>
    <text x="15" y="108" class="pencil" font-size="13">falla, sabés en qué paso</text>
    <text x="15" y="128" class="red-pen" font-size="13">exacto se rompió la foto."</text>

  </g>

  
  <!-- Top: View -->
  <g transform="translate(190, 100)">
    <rect x="20" y="10" width="280" height="45" class="highlight-blue"/>
    <path d="M 0 35 C 0 10, 120 5, 280 8 C 360 10, 380 25, 370 50 C 350 72, 220 75, 80 72 C 0 68, 0 50, 0 35 Z" class="bubble" stroke-width="2.5"/>
    <text x="185" y="43" class="pen-lg" text-anchor="middle">1. LA PANTALLA</text>
    <text x="185" y="88" class="pencil-sm" text-anchor="middle">• Muestra la foto actual | No cambia nada por su cuenta</text>
  </g>

  <!-- Arrow View -> Intent (Top to Right) -->
  <path d="M 570 135 C 660 135, 710 165, 710 220" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>
  
  <!-- Intent Box (Right) -->
  <g transform="translate(615, 220)">
    <rect x="0" y="0" width="210" height="75" class="box" stroke-width="2.2"/>
    <rect x="10" y="10" width="190" height="25" class="highlight-rose"/>
    <text x="105" y="28" class="red-pen" font-size="18" text-anchor="middle">2. LA INTENCIÓN (Intent)</text>
    <text x="105" y="52" class="pencil" font-size="15" text-anchor="middle">"Lo que el usuario quiso hacer"</text>
    <text x="105" y="68" class="pencil-sm" text-anchor="middle">Ej: Tocó Comprar, Deslizó la lista</text>
  </g>

  <!-- Arrow Intent -> Reducer (Right to Bottom) -->
  <path d="M 710 295 C 710 360, 670 410, 580 430" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

  <!-- Reducer / Calculadora (Bottom Center) -->
  <g transform="translate(170, 400)">
    <path d="M 0 45 C 0 10, 140 5, 360 8 C 440 10, 460 30, 450 65 C 430 95, 280 105, 100 100 C 0 95, 0 70, 0 45 Z" class="bubble" stroke-width="2.6" fill="url(#hatch)"/>
    <rect x="30" y="15" width="400" height="75" class="box" fill="#ffffff" stroke-width="2.2"/>
    <rect x="40" y="22" width="380" height="26" class="highlight-yellow"/>
    <text x="230" y="42" class="pen-lg" text-anchor="middle">3. LA CALCULADORA (Reducer)</text>
    <text x="230" y="68" class="pencil" font-weight="bold" text-anchor="middle">Foto vieja + Intención nueva  ➔  Nueva Foto</text>
    <text x="230" y="85" class="pencil-sm" fill="#64748b" text-anchor="middle">Cálculo matemático directo, sin sorpresas</text>
  </g>

  <!-- Arrow Reducer -> State (Bottom to Left) -->
  <path d="M 170 440 C 90 440, 60 370, 60 300" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

  <!-- Single State Box (Left) -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="210" height="85" class="box" stroke-width="2.4"/>
    <rect x="10" y="10" width="190" height="26" class="highlight-green"/>
    <text x="105" y="30" class="green-pen" font-size="18" text-anchor="middle">4. LA FOTO ÚNICA (State)</text>
    <text x="105" y="55" class="pencil-sm" text-anchor="middle">La única verdad de la pantalla</text>
    <text x="105" y="72" class="pencil-sm" text-anchor="middle">Cero estados contradictorios</text>
  </g>

  <!-- Arrow State -> View (Left to Top) -->
  <path d="M 60 220 C 60 160, 110 135, 190 135" class="stroke-pen" stroke-width="2.5" marker-end="url(#pen-arrow)"/>

  <!-- Side Effects callout on the right -->
  <g transform="translate(615, 480)">
    <path d="M 520 440 C 560 450, 590 480, 615 490" class="stroke-red" stroke-dasharray="4,3" marker-end="url(#red-arrow)"/>
    <rect x="0" y="0" width="220" height="75" class="box" stroke="#b91c1c" fill="#fef2f2"/>
    <text x="110" y="25" class="red-pen" text-anchor="middle">⚡ AVISOS RÁPIDOS</text>
    <text x="110" y="46" class="pencil-sm" text-anchor="middle">Pasan una sola vez</text>
    <text x="110" y="65" class="pencil-sm" text-anchor="middle">Cartel de aviso, cambiar de ventana</text>
  </g>


</svg>